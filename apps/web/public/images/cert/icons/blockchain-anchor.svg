<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Chain links -->
  <rect x="3" y="5" width="7" height="5" rx="2.5" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <rect x="14" y="5" width="7" height="5" rx="2.5" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- Connection between links -->
  <line x1="10" y1="7.5" x2="14" y2="7.5" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Anchor line down -->
  <line x1="12" y1="10" x2="12" y2="18" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <!-- Anchor base -->
  <path d="M7 18 L12 22 L17 18" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Anchor crossbar -->
  <line x1="8" y1="14" x2="16" y2="14" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
</svg>