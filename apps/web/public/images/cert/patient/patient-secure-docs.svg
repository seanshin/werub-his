<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" rx="10" fill="#F8FAFC"/>

  <!-- Folder/cabinet -->
  <g transform="translate(45, 25)">
    <!-- Cabinet body -->
    <rect x="0" y="15" width="110" height="85" rx="6" fill="#CBD5E1"/>
    <rect x="3" y="18" width="104" height="79" rx="4" fill="#E2E8F0"/>

    <!-- Folder tab -->
    <path d="M10 15 L10 5 Q10 0 15 0 L45 0 Q50 0 52 5 L55 15" fill="#CBD5E1"/>

    <!-- Documents inside -->
    <rect x="15" y="28" width="80" height="12" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="20" y="32" width="30" height="3" rx="1.5" fill="#93C5FD"/>
    <rect x="55" y="32" width="15" height="3" rx="1.5" fill="#E2E8F0"/>

    <rect x="15" y="46" width="80" height="12" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="20" y="50" width="25" height="3" rx="1.5" fill="#93C5FD"/>
    <rect x="50" y="50" width="20" height="3" rx="1.5" fill="#E2E8F0"/>

    <rect x="15" y="64" width="80" height="12" rx="3" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="20" y="68" width="35" height="3" rx="1.5" fill="#93C5FD"/>
    <rect x="60" y="68" width="12" height="3" rx="1.5" fill="#E2E8F0"/>

    <!-- Lock on cabinet -->
    <g transform="translate(55, 84)">
      <rect x="-8" y="0" width="16" height="12" rx="3" fill="#64748B"/>
      <path d="M-4-1 L-4-6 Q-4-10 0-10 Q4-10 4-6 L4-1" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="5" r="2" fill="#F8FAFC"/>
    </g>
  </g>

  <!-- Shield overlay -->
  <g transform="translate(135, 30)">
    <path d="M0-18 L18-12 L18 4 Q18 18 0 25 Q-18 18-18 4 L-18-12Z" fill="#3B82F6" opacity="0.15"/>
    <path d="M0-14 L14-9 L14 3 Q14 14 0 20 Q-14 14-14 3 L-14-9Z" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    <path d="M-5 2 L-1 6 L7-2" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  </g>
</svg>