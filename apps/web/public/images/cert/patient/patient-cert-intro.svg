<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F8FAFC"/>

  <!-- Person silhouette -->
  <g transform="translate(90, 55)">
    <circle cx="0" cy="0" r="18" fill="#CBD5E1"/>
    <path d="M-24 50 Q-24 30 0 28 Q24 30 24 50" fill="#CBD5E1"/>
  </g>

  <!-- Smartphone -->
  <g transform="translate(155, 35)">
    <rect x="0" y="0" width="60" height="110" rx="10" fill="#1E293B"/>
    <rect x="4" y="12" width="52" height="82" rx="2" fill="white"/>
    <!-- Screen: certificate card -->
    <rect x="10" y="20" width="40" height="30" rx="4" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <rect x="10" y="20" width="40" height="10" rx="4" fill="#3B82F6"/>
    <rect x="10" y="26" width="40" height="4" fill="#3B82F6"/>
    <rect x="14" y="36" width="24" height="2" rx="1" fill="#93C5FD"/>
    <rect x="14" y="41" width="18" height="2" rx="1" fill="#93C5FD"/>
    <!-- Checkmark on card -->
    <circle cx="42" cy="42" r="5" fill="#10B981"/>
    <path d="M39 42 L41 44 L45 40" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- More screen content -->
    <rect x="10" y="58" width="40" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="10" y="66" width="40" height="14" rx="4" fill="#3B82F6"/>
    <rect x="18" y="71" width="24" height="4" rx="2" fill="white" opacity="0.8"/>
    <!-- Home indicator -->
    <rect x="20" y="98" width="20" height="3" rx="1.5" fill="#475569"/>
  </g>

  <!-- Connection arc -->
  <path d="M108 80 Q130 60 155 65" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Bottom text -->
  <text x="150" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Digital Certificate</text>
  <text x="150" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Always accessible on your device</text>
</svg>