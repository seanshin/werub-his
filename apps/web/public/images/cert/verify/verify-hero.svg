  <rect x="130" y="50" width="140" height="36" rx="8" fill="#EFF6FF"/>
  <rect x="130" y="78" width="140" height="8" rx="0" fill="#EFF6FF"/>

  <!-- Document lines -->
  <rect x="150" y="60" width="60" height="6" rx="3" fill="#93C5FD"/>
  <rect x="150" y="100" width="100" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="150" y="114" width="90" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="150" y="128" width="95" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="150" y="142" width="80" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="150" y="162" width="100" height="4" rx="2" fill="#E2E8F0"/>
