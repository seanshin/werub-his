<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F8FAFC"/>

  <!-- File/document icon -->
  <g transform="translate(110, 40)">
    <rect x="0" y="0" width="40" height="50" rx="4" fill="white" stroke="#86EFAC" stroke-width="2"/>
    <path d="M28 0 L40 12" stroke="#86EFAC" stroke-width="2" fill="none"/>
    <path d="M28 0 L28 12 L40 12" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
    <rect x="8" y="20" width="24" height="3" rx="1.5" fill="#BBF7D0"/>
    <rect x="8" y="28" width="18" height="3" rx="1.5" fill="#BBF7D0"/>
    <rect x="8" y="36" width="22" height="3" rx="1.5" fill="#BBF7D0"/>
  </g>

  <!-- Download arrow -->
  <g transform="translate(150, 95)">
    <path d="M0 0 L0 24" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 16 L0 26 L8 16" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Vault/Safe -->
  <g transform="translate(115, 125)">
    <rect x="0" y="0" width="70" height="50" rx="6" fill="#059669"/>
    <rect x="3" y="3" width="64" height="44" rx="4" fill="#10B981"/>
    <!-- Vault door detail -->
    <circle cx="35" cy="25" r="12" fill="none" stroke="#ECFDF5" stroke-width="2"/>
    <circle cx="35" cy="25" r="3" fill="#ECFDF5"/>
    <!-- Handle -->
    <rect x="50" y="20" width="10" height="3" rx="1.5" fill="#ECFDF5"/>
    <rect x="50" y="27" width="10" height="3" rx="1.5" fill="#ECFDF5"/>
    <!-- Lock indicator -->
    <circle cx="14" cy="12" r="4" fill="#34D399"/>
    <path d="M12 12 L14 14 L17 10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="3" fill="#BBF7D0"/>
  <circle cx="240" cy="60" r="4" fill="#BBF7D0"/>
  <circle cx="230" cy="140" r="3" fill="#D1FAE5"/>

  <!-- Bottom label -->
  <text x="150" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Step 3 of 3</text>
</svg>