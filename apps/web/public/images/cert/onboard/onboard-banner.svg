<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" fill="none">
  <defs>
    <linearGradient id="bannerGrad" x1="0" y1="0" x2="600" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="120" rx="8" fill="url(#bannerGrad)"/>

  <!-- Blockchain node pattern -->
  <g stroke="white" stroke-width="0.8" opacity="0.12" fill="none">
    <!-- Hexagons -->
    <path d="M50 30 L62 24 L74 30 L74 42 L62 48 L50 42Z"/>
    <path d="M74 30 L86 24 L98 30 L98 42 L86 48 L74 42Z"/>
    <path d="M62 48 L74 42 L86 48 L86 60 L74 66 L62 60Z"/>
    <path d="M140 50 L152 44 L164 50 L164 62 L152 68 L140 62Z"/>
    <path d="M164 50 L176 44 L188 50 L188 62 L176 68 L164 62Z"/>
    <!-- Right side hexagons -->
    <path d="M420 20 L432 14 L444 20 L444 32 L432 38 L420 32Z"/>
    <path d="M444 20 L456 14 L468 20 L468 32 L456 38 L444 32Z"/>
    <path d="M432 38 L444 32 L456 38 L456 50 L444 56 L432 50Z"/>
    <path d="M500 60 L512 54 L524 60 L524 72 L512 78 L500 72Z"/>
    <path d="M524 60 L536 54 L548 60 L548 72 L536 78 L524 72Z"/>
  </g>

  <!-- Connection lines -->
  <g stroke="white" stroke-width="0.5" opacity="0.08">
    <line x1="86" y1="36" x2="140" y2="56"/>
    <line x1="188" y1="56" x2="420" y2="26"/>
    <line x1="456" y1="44" x2="500" y2="66"/>
  </g>

  <!-- Node dots -->
  <g fill="white" opacity="0.15">
    <circle cx="62" cy="36" r="3"/>
    <circle cx="86" cy="36" r="3"/>
    <circle cx="152" cy="56" r="3"/>
    <circle cx="176" cy="56" r="3"/>
    <circle cx="432" cy="26" r="3"/>
    <circle cx="456" cy="26" r="3"/>
    <circle cx="512" cy="66" r="3"/>
    <circle cx="536" cy="66" r="3"/>
  </g>

  <!-- Key icon -->
  <g transform="translate(540, 60)" opacity="0.2">
    <circle cx="0" cy="-10" r="10" fill="none" stroke="white" stroke-width="2.5"/>
    <rect x="-2" y="0" width="4" height="20" rx="1" fill="white"/>
    <rect x="2" y="12" width="6" height="3" rx="1" fill="white"/>
    <rect x="2" y="6" width="4" height="3" rx="1" fill="white"/>
  </g>
