<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F8FAFC"/>

  <!-- Central generation point -->
  <circle cx="150" cy="90" r="20" fill="#DBEAFE"/>
  <circle cx="150" cy="90" r="14" fill="#3B82F6"/>
  <!-- Sparkle in center -->
  <path d="M150 80 L152 86 L158 88 L152 90 L150 96 L148 90 L142 88 L148 86Z" fill="white"/>

  <!-- Left key (private) -->
  <g transform="translate(60, 75)">
    <circle cx="0" cy="0" r="14" fill="#1D4ED8" opacity="0.15"/>
    <rect x="-8" y="-12" width="16" height="24" rx="8" fill="none" stroke="#1D4ED8" stroke-width="2.5"/>
    <rect x="-2" y="12" width="4" height="18" rx="1" fill="#1D4ED8"/>
    <rect x="2" y="22" width="6" height="3" rx="1" fill="#1D4ED8"/>
    <rect x="2" y="16" width="4" height="3" rx="1" fill="#1D4ED8"/>
  </g>

  <!-- Right key (public) -->
  <g transform="translate(240, 75)">
    <circle cx="0" cy="0" r="14" fill="#60A5FA" opacity="0.15"/>
    <rect x="-8" y="-12" width="16" height="24" rx="8" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
    <rect x="-2" y="12" width="4" height="18" rx="1" fill="#60A5FA"/>
    <rect x="2" y="22" width="6" height="3" rx="1" fill="#60A5FA"/>
    <rect x="2" y="16" width="4" height="3" rx="1" fill="#60A5FA"/>
  </g>

  <!-- Connection lines -->
  <path d="M130 85 Q110 70 80 80" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M170 85 Q190 70 220 80" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 3" fill="none"/>

  <!-- Labels -->
  <text x="60" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1D4ED8">Private Key</text>
  <text x="240" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#60A5FA">Public Key</text>

  <!-- Bottom label -->
  <text x="150" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1E40AF">Key Pair Generation</text>
  <text x="150" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Step 1 of 3</text>
</svg>