<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F8FAFC"/>

  <!-- Lock icon above keypad -->
  <g transform="translate(150, 36)">
    <rect x="-12" y="0" width="24" height="18" rx="4" fill="#3B82F6"/>
    <path d="M-7-1 L-7-8 Q-7-16 0-16 Q7-16 7-8 L7-1" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="8" r="3" fill="white"/>
    <rect x="-1" y="9" width="2" height="4" rx="1" fill="white"/>
  </g>

  <!-- PIN dots row -->
  <circle cx="95" cy="72" r="6" fill="#3B82F6"/>
  <circle cx="115" cy="72" r="6" fill="#3B82F6"/>
  <circle cx="135" cy="72" r="6" fill="#3B82F6"/>
  <circle cx="155" cy="72" r="6" fill="#3B82F6"/>
  <circle cx="175" cy="72" r="6" fill="#BFDBFE"/>
  <circle cx="195" cy="72" r="6" fill="#BFDBFE"/>

  <!-- Numeric keypad -->
  <g transform="translate(105, 92)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="13" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">1</text>
    <rect x="32" y="0" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="45" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">2</text>
    <rect x="64" y="0" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="77" y="18" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">3</text>
    <!-- Row 2 -->
    <rect x="0" y="32" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="13" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">4</text>
    <rect x="32" y="32" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="45" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">5</text>
    <rect x="64" y="32" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="77" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">6</text>
    <!-- Row 3 -->
    <rect x="0" y="64" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="13" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">7</text>
    <rect x="32" y="64" width="26" height="26" rx="6" fill="#3B82F6"/>
    <text x="45" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="white">8</text>
    <rect x="64" y="64" width="26" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="77" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#3B82F6">9</text>
  </g>

  <!-- Bottom label -->
  <text x="150" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Step 2 of 3</text>
</svg>