<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" fill="none">
  <rect width="300" height="200" rx="12" fill="#F8FAFC"/>

  <!-- Certificate card -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="100" height="70" rx="6" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <rect x="0" y="0" width="100" height="20" rx="6" fill="#3B82F6"/>
    <rect x="0" y="14" width="100" height="6" fill="#3B82F6"/>
    <!-- Card header text -->
    <rect x="10" y="7" width="40" height="4" rx="2" fill="white" opacity="0.8"/>
    <!-- Card body lines -->
    <rect x="10" y="30" width="60" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="10" y="38" width="50" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="10" y="46" width="55" height="3" rx="1.5" fill="#E2E8F0"/>
    <!-- Gold seal -->
    <circle cx="78" cy="52" r="10" fill="#C5A55A"/>
    <circle cx="78" cy="52" r="7" fill="#D4AF37"/>
    <path d="M74 52 L77 55 L83 49" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars -->
  <g fill="#FBBF24">
    <path d="M70 45 L72 50 L77 50 L73 53 L74 58 L70 55 L66 58 L67 53 L63 50 L68 50Z" transform="scale(0.6)"/>
    <path d="M380 60 L382 65 L387 65 L383 68 L384 73 L380 70 L376 73 L377 68 L373 65 L378 65Z" transform="scale(0.6)"/>
    <path d="M130 25 L131.5 29 L136 29 L132.5 31.5 L133.5 35.5 L130 33 L126.5 35.5 L127.5 31.5 L124 29 L128.5 29Z" transform="scale(0.7)"/>
  </g>

  <!-- Confetti pieces -->
  <rect x="60" y="55" width="8" height="4" rx="2" fill="#3B82F6" opacity="0.6" transform="rotate(-20 64 57)"/>
  <rect x="230" y="50" width="8" height="4" rx="2" fill="#10B981" opacity="0.6" transform="rotate(15 234 52)"/>
  <rect x="80" y="130" width="6" height="3" rx="1.5" fill="#F97316" opacity="0.5" transform="rotate(-30 83 131)"/>
  <rect x="220" y="120" width="6" height="3" rx="1.5" fill="#8B5CF6" opacity="0.5" transform="rotate(25 223 121)"/>
  <circle cx="65" cy="90" r="3" fill="#FBBF24" opacity="0.5"/>
  <circle cx="240" cy="85" r="3" fill="#EC4899" opacity="0.5"/>
  <circle cx="75" cy="115" r="2" fill="#3B82F6" opacity="0.4"/>
  <circle cx="225" cy="140" r="2" fill="#10B981" opacity="0.4"/>

  <!-- Bottom label -->
  <text x="150" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Setup Complete!</text>
  <text x="150" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Your certificate is ready</text>
</svg>