<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 60" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="595" y2="0">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="595" height="60" fill="url(#headerGrad)"/>

  <!-- Left decorative line -->
  <rect x="20" y="27" width="40" height="1.5" rx="0.75" fill="white" opacity="0.3"/>

  <!-- Medical cross icon -->
  <g transform="translate(80, 30)">
    <rect x="-6" y="-3" width="12" height="6" rx="1" fill="white" opacity="0.9"/>
    <rect x="-3" y="-6" width="6" height="12" rx="1" fill="white" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="100" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="1">Hospital RUN</text>
  <text x="260" y="36" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="white" opacity="0.85" letter-spacing="0.5">전자인증서</text>

  <!-- Right side chain icon -->
  <g transform="translate(530, 30)" opacity="0.3">
    <ellipse cx="-8" cy="0" rx="8" ry="5" fill="none" stroke="white" stroke-width="1.5"/>
    <ellipse cx="8" cy="0" rx="8" ry="5" fill="none" stroke="white" stroke-width="1.5"/>
  </g>

  <!-- Right decorative line -->
  <rect x="555" y="27" width="25" height="1.5" rx="0.75" fill="white" opacity="0.3"/>

  <!-- Bottom accent line -->
  <rect x="0" y="57" width="595" height="3" fill="#C5A55A" opacity="0.8"/>
</svg>