<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <path id="textCircle" d="M40,12 a28,28 0 1,1 0,56 a28,28 0 1,1 0,-56"/>
    <path id="textCircleBottom" d="M16,40 a24,24 0 1,0 48,0"/>
  </defs>
  <!-- Double ring border -->
  <circle cx="40" cy="40" r="37" fill="none" stroke="#2563EB" stroke-width="2"/>
  <circle cx="40" cy="40" r="33" fill="none" stroke="#2563EB" stroke-width="1"/>
  <!-- Chain link icon in center -->
  <g transform="translate(26, 32)" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="2" width="12" height="12" rx="4" ry="4"/>
    <rect x="16" y="2" width="12" height="12" rx="4" ry="4"/>
    <line x1="12" y1="8" x2="16" y2="8" stroke-width="2"/>
  </g>
  <!-- Circular text - top: BLOCKCHAIN VERIFIED -->
  <text fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="700" letter-spacing="2.5">
    <textPath href="#textCircle" startOffset="15%">BLOCKCHAIN VERIFIED</textPath>
  </text>
  <!-- Bottom text -->
  <text x="40" y="58" text-anchor="middle" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="5" font-weight="600" letter-spacing="1">Hospital RUN</text>
</svg>
