# ============================================================================
# HIS 단독 설치용 nginx — PACS(OpenPACS)가 **없는** 설치본 (2026-09-21 갈래 E · 형제 프로젝트 R13)
#
# 🔴 왜 파일을 나눴나: 같은 폴더의 `prod.conf` 는 `ohif`·`orthanc`·`pacs-api` upstream 을 선언한다.
#    HIS 단독 compose(`docker-compose.prod.yml`)에는 그 컨테이너가 없어서 nginx 가
#    `host not found in upstream "ohif"` 로 **기동 자체를 거부**한다 — 새 기관 설치가 여기서 막혔다.
#
# 🔴 `prod.conf` 는 손대지 않는다(PACS 경로 수정 금지 — CLAUDE.md §PACS). PACS 를 함께 설치하는
#    기관은 그대로 `prod.conf` 를 마운트한다. 이 파일은 **HIS 만** 서비스한다.
#
# 🔴 PACS 경로는 여기서 조용히 404(프런트엔드 폴백)로 떨어뜨리지 않고, "이 설치본에는 PACS 가 없다"를
#    그 자리에서 말한다 — 없는 것과 고장난 것은 다른 사실이다.
#
# 두 파일의 HIS 공통 블록(API·FHIR·업로드·정적·프런트엔드)은
# `apps/api/test/architecture/container-install-contract.spec.ts` 가 기계 대조한다(한쪽만 고치면 실패).
# ============================================================================

upstream web_backend {
    server web:3000;
}

upstream api_backend {
    server api:4000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:;" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Logging ──
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Client Limits ──
    client_max_body_size 50M;
    client_body_timeout  60s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # ── API Routes ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Auth Rate Limit (로그인 브루트포스 방지) ──
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── FHIR API ──
    location /fhir/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 이 설치본에는 PACS 가 없다 ──
    # 🔴 영상 관련 화면이 열리더라도 뒤가 없다는 것을 그 자리에서 말한다(조용한 404 로 두지 않는다).
    #    PACS 를 함께 설치하면 이 파일 대신 `prod.conf` 를 마운트한다.
    location ~ ^/(viewer|dicom-web|wado|pacs-api|pacs)(/|$) {
        default_type text/plain;
        return 503 "PACS(OpenPACS) is not installed in this deployment.\n";
    }

    # ── Health Check (내부만) ──
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    # ── 진료 첨부(PHI)는 공개 업로드 경로에서 차단 — 스트리밍 EP(/api/v1/encounters/*/attachments/file)로만 서빙 ──
    location ^~ /uploads/encounters/ {
        return 404;
    }

    # ── CMS 이미지/업로드 파일 (30일 캐시) ──
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Static Assets Cache ──
    location /_next/static/ {
        proxy_pass http://web_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend ──
    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
