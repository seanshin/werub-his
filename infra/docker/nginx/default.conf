upstream web {
    server web:3000;
}

upstream api {
    server api:4000;
}

upstream ohif {
    server ohif:3001;
}

upstream orthanc {
    server orthanc:8042;
}

upstream pacs_api {
    server pacs-api:8000;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location /fhir/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api;
    }

    # ── PACS SSO Routes ──
    location /viewer/ {
        proxy_pass http://ohif;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /dicom-web/ {
        proxy_pass http://orthanc;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Source $http_x_auth_source;
    }

    location /wado {
        proxy_pass http://orthanc;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /pacs-api/ {
        proxy_pass http://pacs_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Source $http_x_auth_source;
        proxy_set_header X-HIS-User-Id $http_x_his_user_id;
        proxy_set_header X-HIS-User-Email $http_x_his_user_email;
        proxy_set_header X-HIS-User-Role $http_x_his_user_role;
    }

    # ── 진료 첨부(PHI)는 공개 업로드 경로에서 차단 — 스트리밍 EP(/api/v1/encounters/*/attachments/file)로만 서빙 ──
    location ^~ /uploads/encounters/ {
        return 404;
    }

    # ── CMS 이미지/업로드 파일 ──
    location /uploads/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── Frontend ──
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
