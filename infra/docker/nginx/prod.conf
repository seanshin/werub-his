upstream web_backend {
    server web:3000;
}

upstream api_backend {
    server api:4000;
}

upstream ohif_viewer {
    server ohif:3001;
}

upstream orthanc_backend {
    server orthanc:8042;
}

upstream pacs_backend {
    server pacs-api:8000;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:;" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Logging ──
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Client Limits ──
    client_max_body_size 50M;
    client_body_timeout  60s;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # ── API Routes ──
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Auth Rate Limit (로그인 브루트포스 방지) ──
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── FHIR API ──
    location /fhir/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PACS SSO: Viewer 요청 시 Authorization 헤더 전달 ──
    location /viewer/ {
        proxy_pass http://ohif_viewer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PACS SSO: DICOMweb 요청에 Authorization 헤더 패스스루 ──
    location /dicom-web/ {
        proxy_pass http://orthanc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Source $http_x_auth_source;
        proxy_set_header X-HIS-User-Id $http_x_his_user_id;
    }

    location /wado {
        proxy_pass http://orthanc_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    # ── PACS API (OpenPACS FastAPI) ──
    location /pacs-api/ {
        proxy_pass http://pacs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Auth-Source $http_x_auth_source;
        proxy_set_header X-HIS-User-Id $http_x_his_user_id;
        proxy_set_header X-HIS-User-Email $http_x_his_user_email;
        proxy_set_header X-HIS-User-Role $http_x_his_user_role;
    }

    # ── Health Check (내부만) ──
    location /health {
        proxy_pass http://api_backend;
        access_log off;
    }

    # ── 진료 첨부(PHI)는 공개 업로드 경로에서 차단 — 스트리밍 EP(/api/v1/encounters/*/attachments/file)로만 서빙 ──
    location ^~ /uploads/encounters/ {
        return 404;
    }

    # ── CMS 이미지/업로드 파일 (30일 캐시) ──
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Static Assets Cache ──
    location /_next/static/ {
        proxy_pass http://web_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend ──
    location / {
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
