#      컴파일러가 이 파일만 보고 산출물을 만들면 그 손실은 **그대로 실물보다 덜 안전한 산출물**이 된다(§4-L0 역방향 손실).
#   4. `metadata.labels`(자유 문자열 맵)에 담지 않는다 — 담으면 스키마가 못 담는다는 사실이 감춰진다.

apiVersion: loop.hospital/v1
kind: Loop

metadata:
  # 근거: 스킬 키 `interpretLab`(apps/api/src/common/ai-skill-quality.ts:26) ·
  #       감사 resourceType `AiInterpretLab`/`AiInterpretLabOutcome`(medical-ai.controller.ts:415-418)
