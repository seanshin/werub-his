  id: lab.interpret-lab
  name: 검사해석 # 근거: AI_QUALITY_SKILLS label(ai-skill-quality.ts:34) · FE 탭 라벨(ai-skill-modes.ts:32)
  description: >-
    전달된 검사 결과(값·단위·기준치·LIS flag)를 환자 맥락(연령·성별·활성 문제목록·활성 처방·직전 30일 확정검사)과
    함께 LLM 에 보내 한국어 해석을 받고, 결정론 검증 6규칙을 통과한 것만 `source: AI` 로 낸다.
    통과하지 못하면 본문을 지우지 않고 `source: FALLBACK` + 사유 코드로 표시한다.
    LLM 이 응답하지 못하면 LIS flag·기준치만 쓰는 규칙 기반 해석으로 접고 그렇게 말한다.

  # ── 비워 둔 필수 필드 (여기가 이 파일럿의 산출물이다) ────────────────────────────────
  # version: (required) ⚠️ 실물에 대응물 **없음**. 이 스킬에는 버전이 없다 — 프롬프트도 검증규칙도
  #          코드와 함께 배포되고, 감사행에도 `prompt_version`/`model_id` 가 남지 않는다.
  #          (실측: medical-ai.controller.ts:232-235 `outcomeMeta` = source·reason·latencyMs·verifyFailed 4키뿐)
