  #
  # owners: (required) ⚠️ 실물에 **없음**. 이 저장소에 CODEOWNERS 파일이 없고(실측: `ls CODEOWNERS
  #         .github/CODEOWNERS` → 둘 다 부재), 검사해석의 임상 오너가 지정된 곳이 없다.
  #         가장 가까운 실물은 `ai-verify.ts:82` 주석 "최소 사전 — 위원회가 관리한다"(**계획**이지 배선이 아님).
  #
  # approvals: ⚠️ 이 스킬에 대한 위원회 승인 이력이 **없다**. optional 이라 비워도 스키마는 통과한다
