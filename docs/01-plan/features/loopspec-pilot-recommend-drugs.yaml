# LoopSpec L1 역기술 파일럿 A — `recommendDrugs`(약물추천 · AI 출력을 정본 서비스로 재검증)
#
# 목적: L0(`interpret-lab`)이 "AI 조회 → 초안 반환" **한 종류**만 봤기 때문에, 다른 축의 루프를
#       역기술해 표현 불가 목록이 **구조적인지 국소적인지** 가른다. 정본 = `loop-platform-adoption.plan.md` §4-L1.
# 이 축이 L0 와 다른 점:
#   · LLM 출력을 **정본 서비스(DUR·약가마스터)로 재검증**하고 그 판정을 항목마다 붙인다(`drug-verdict.ts`).
#   · `write_back` 은 없는데 **판정이 화면 동작을 바꾼다**(BLOCK/UNRESOLVED → 처방 폼 프리필 버튼 비활성).
#   · 검증 실패 사유에 따라 **조건부 재호출**이 있고 그것이 시간 예산에 묶여 있다.
#
# 작성 2026-08-20 · 스키마 원본은 저장소 밖(`~/Downloads/loopspec.schema.json`) — 복사하지 않는다(§0 규약).
# 🔴 작성 규칙은 L0 파일과 같다: 실물에서 읽은 값만 · 모르는 값/하드락은 **비운다** · 표현 손실은 `# 🔴` 로 남긴다.
