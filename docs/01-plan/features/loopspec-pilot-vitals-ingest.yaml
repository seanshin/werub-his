# LoopSpec L1 역기술 파일럿 B — `VitalsIngestService`(활력 수집 포트 · **AI 가 아니다**)
#
# 목적: LoopSpec 이 **비-AI 결정론 파이프라인**을 담는가를 판정한다. 정본 = `loop-platform-adoption.plan.md` §4-L1.
# 🔴 이 파일의 결론은 "담긴다"가 아니어도 된다. **범위를 좁히는 것도 판정이다** —
#    억지로 담으려 하면 스키마가 못 하는 일을 하는 척하게 되고, 그게 이 저장소가 반복해서 다친 방식이다.
#
# 이 축이 L0·A 와 다른 점:
#   · LLM 이 없다. 모델도 프롬프트도 검증층도 없고, `risk.ai_disclosure`·`reasoning`·`verification` 이 전부 공허하다.
#   · **실제 임상 기록을 쓴다**(PreVisitVitals·FlowSheetEntry·IcuRecord — 초안이 아니다).
#   · 판정이 3상태다: `STORED`/`DUPLICATE`/`PENDING` + `timeFlags[]` + `dedupeChecked`(= 판정 불가 표시).
#
# 작성 2026-08-20 · 스키마 원본은 저장소 밖 — 복사하지 않는다(§0).
# 검증: `node scripts/loopspec-validate.mjs ~/Downloads/loopspec.schema.json docs/01-plan/features/loopspec-pilot-vitals-ingest.yaml`

apiVersion: loop.hospital/v1
kind: Loop

metadata:
  id: vitals.ingest-port
  # ⚠️ 유도한 이름이다. 실물에는 루프 ID 개념이 없고, 이 서비스는 "루프"가 아니라 **포트**로 설계됐다
  #    (vitals-ingest.service.ts:7 "활력이 저장되는 단 하나의 진입점").
  name: 활력 수집 포트
  description: >-
    외래·입원·중환자 세 경로의 활력 쓰기를 한 진입점으로 모아 정규화(결측은 null·기기 보고값은 재반올림 금지)·
    멱등(같은 환자·같은 측정시각·같은 6값의 재수신 저장 안 함)·시각검사(미상/미래/과도소급 표시)·
    환자결속(근거 없으면 저장 안 함)·저장·이벤트 발행(외래만)을 한다.
    저장할 컬럼이 없는 것(출처·기기·신뢰도·원문참조·수신시각)은 **받되 저장하지 않고 그 사실을 반환값이 밝힌다**.

  # version: (required) ⚠️ 실물에 없음(L0·A 와 동일 — 코드와 함께 배포된다).
  # owners: (required) ⚠️ 실물에 없음(CODEOWNERS 부재).
  #   🔴 이 포트의 실질 오너는 **간호부 + 의공학(기기)** 인데 `owners.clinical` 은 문자열 하나다(A 와 같은 자리).

  lifecycle: general
  # 근거: 세 경로 모두 이 포트를 지나도록 **구조 가드로 동결**돼 있다
  #       (test/architecture/vitals-ingest-port-guard.spec.ts:50-76 — 여유 0).
  # 🔴 표현 손실 — 이 포트의 "완성도"는 lifecycle 로 표현되지 않는다. 배선은 general 인데
  #    스키마 승인 대기 때문에 **기능의 절반이 미구축**이다(아래 `unstored` 참조).
  #    `draft|shadow|limited|general|deprecated|retired` 중 "배선 완료 · 저장 불가 필드 6종"을 뜻하는 값이 없다.

  authoring:
    generated_by: llm_draft
    generator_version: claude-opus-5-1m/loopspec-l1-pilot-2026.08.20
    source_request: >-
      LoopSpec L1 표현력 판정 — 비-AI 결정론 파이프라인이 LoopSpec 으로 표현되는가(§4-L1 축 B).
    # reviewed_by / reviewed_at: 미검토 → L22 ERROR 대상.

spec:
  audience:
    subject: clinician
    roles:
      # 근거: `POST /api/v1/vitals` = `@Roles(DOCTOR, NURSE, ADMIN)`(vitals.controller.ts:14)
      #       `POST /api/v1/nurse-station/vitals/:queueId` = `@Roles(NURSE, ADMIN)`(nurse-station.controller.ts:99)
      - ATTENDING
      - RESIDENT
      - WARD_NURSE
      - CHARGE_NURSE
      - ADMIN_STAFF
      # 🔴 U21 **재확인** — `ADMIN`(시스템 관리자) 대응 값이 없다. 그리고 U2 **재확인** —
      #    진입 경로마다 역할이 다른데(`DOCTOR` 는 nurse-station 경로에 없다) `roles` 는 루프당 하나다.
      # 🔴 신규 — 이 포트의 실제 수혜자는 **미래의 기기**다(`VitalsSourceKind: DEVICE`).
      #    기기는 사람 역할이 아니고 `audience.subject` enum 은 `clinician|patient` 둘뿐이라
      #    "무인 기기 수집"을 대상으로 선언할 자리가 없다. 그래서 지금 기기 측정은 저장조차 못 한다
      #    (`recordedBy` NOT NULL → `PENDING(NO_RECORDER)` · vitals-ingest.service.ts:32-33,331).

  lane: sync
  # 근거: 간호사가 폼을 저장하고 응답을 기다린다(`meta.ingest` 를 화면이 문장으로 바꾼다 —
  #       lib/vitals-ingest-notice.ts:38-59 → InternalMedicineEncounterLayout.tsx:209 등 4화면).

  risk:
    # tier: (required) 🔴 하드락 ∩ required(U11).
    #   🔴 신규 — 그리고 **enum 자체가 이 루프를 담지 못한다**: 0=확정 사실 전달 · 1=정보 수집·정리·전달(초안) ·
    #   2=임상적 판단. 이 포트는 셋 중 어느 것도 아니다 — **사람이 관측한 사실을 법정기록에 쓴다.**
    #   `tier` 는 "AI 자율성 등급"이라 비-AI 루프에서는 의미가 없는데 required 다.
    ai_disclosure:
      required: false
      # 근거: LLM·생성형 출력이 이 경로에 없다. 🔴 그런데 이 필드는 `Risk` 의 **required** 다 —
      #    비-AI 루프도 "AI 고지 여부"를 반드시 선언해야 한다. `false` 가 사실이긴 하나,
      #    스키마가 AI 루프만 상정한다는 증거다(적용 범위 미명시 · §4-L1 (3)).
    # privacy: 생략 — 외부 전송이 없다.
    #   🔴 `external_model_transfer` 의 `default: TOKENIZED_ONLY` 가 여기서 특히 나쁘게 작동한다(U13 확장):
    #      **모델을 아예 쓰지 않는 루프**의 빈 자리가 문서상 "토큰화 후 외부 전송"으로 읽힌다.
    #      "해당 없음"을 적을 값이 enum 에 없다.

  triggers:
    # 🔴 U1 **재확인 = 구조적**. 실물 진입은 전부 "사람이 폼을 저장했다"이고 `hook` enum 9종에 없다.
    #    `patient-view`·`note-open`·`worklist-render` 는 전부 거짓이다(읽는 순간이 아니라 쓰는 순간이다).
    #
    # 실물 호출부(4곳 · 전부 사람의 저장 행위):
    #   ① `VitalsService.record`   ← POST /api/v1/vitals            (vitals.service.ts:103)
    #   ② `NurseStationService`    ← POST /api/v1/nurse-station/vitals/:queueId (nurse-station.controller.ts:107)
    #   ③ `NursingService`         ← 입원 플로시트                    (구조 가드가 포트 호출을 강제 · guard spec:67-76)
    #   ④ `IcuService`             ← 중환자 기록                       (동)
    #
    # 🔴 그래서 여기도 **적을 수 있는 트리거가 0개**다(축 A 와 같다). `minItems: 1` 을 채우려면
    #    거짓을 적어야 한다 → 비운다.
    []

  eligibility:
    include:
      - id: PATIENT_BINDING_PRESENT
        expr: 'route == OUTPATIENT ? patientId.nonEmpty : admissionId.nonEmpty'
        note: >-
          근거 vitals-ingest.service.ts:324-329 `checkBinding`. 🔴 추정 결속 금지 — 근거가 없으면
          저장하지 않고 `PENDING(NO_PATIENT_BINDING)` 을 돌려준다.
      - id: RECORDER_PRESENT
        expr: recordedBy.nonEmpty
        note: >-
          근거 :330-331. 세 저장소 모두 `recordedBy`/`nurseId` 가 NOT NULL 이라 사람 없이 저장할 수 없다.
          아무 사람 ID 를 빌려 쓰면 그 순간 원장이 거짓이 되므로 `PENDING(NO_RECORDER)`.
    # 🔴 표현 손실(**신규 N12 축**) — `Eligibility` 는 "루프를 돌릴지 말지"의 게이트인데,
    #    실물의 이 두 조건은 **돌린 뒤에 저장을 보류하는** 조건이고 그 사실이 호출자에게 반환된다.
    #    `include`/`exclude` 는 제외 사유 코드표를 만들지만(설계서 §1) 그 코드가 **응답에 실려 화면 문장이 되는**
    #    계약은 적을 자리가 없다(lib/vitals-ingest-notice.ts 가 그 정본이다).
    # 🔴 표현 불가 — 이 포트의 **적용 범위 자체**가 스키마에 없다:
    #    저장소 3종(PreVisitVitals·FlowSheetEntry·IcuRecord)만이 대상이고, PACU 활력
    #    (`pacuRecord.vitalSigns` JSON · pacu.service.ts:143-162)과 원격진료 간호차트는 **포트 밖**이다.
    #    구조 가드가 동결한 것도 그 3종뿐이다(guard spec:24-28). `audience.scope` 는 부서·병동·진료유형만 받는다.

  context:
    auth:
      # 🔴 U3 **재확인 = 구조적**. enum 두 값 중 어느 것도 사실이 아니다 —
      #    컨트롤러가 역할만 확인하고(vitals.controller.ts:13-14) 서비스는 서버 자격으로 Prisma 에 쓴다.
      #    `on_behalf_of`(토큰 교환·권한 교집합)도 `service_account_minimal`(전용 최소 스코프 계정)도 아니다.
      patient_binding: session_bound
      # ⚠️ L0·A 와 같은 유보 — 세션이 아니라 요청 본문·경로 파라미터가 정한다.

    resources: []
    # 🔴 **이것이 이 루프에서 가장 큰 표현 불가다**(U15 의 극단형).
    #    빈 배열은 스키마상 "환자 데이터를 일절 조회하지 않음"이라는 유효한 **주장**이다(설계서 §1).
    #    그리고 그 주장은 참이다 — 이 포트는 조회하지 않는다.
    #    그런데 이 루프의 입력은 **전부 호출자가 실어 보낸 임상 관측값**이다
    #    (`VitalsObservation` · vitals-ingest.service.ts:121-141 — 활력 11값 + 동반 컬럼 22값).
    #    `context.resources: []` 를 그대로 읽으면 "이 루프는 환자 데이터를 다루지 않는다"로 오독된다.
    #    → 🔴 **스키마가 실물보다 안전하게 말한다.** `context.inputs[]` 가 없으면 이 루프는
    #       최소수집 근거표에 "조회 리소스 0건"으로 출력되고, 실제로 오가는 33개 임상 필드는 문서에 나타나지 않는다.

    # precompute / knowledge: 해당 없음.

    redaction:
      tokenize: []
      # 근거: 마스킹이 없다(필요도 없다 — 외부로 나가지 않는다).
      # 🔴 U19 **재확인** — "필요 없어서 없다"와 "필요한데 없다"를 구분할 값이 없다.
      #    L0 에서는 같은 `tokenize: []` 가 **위험**을 뜻했다(자유 텍스트가 무검사로 AI 서버로 나감).
      #    같은 표기가 정반대 사실을 뜻하는데 스키마는 둘을 구분하지 못한다.

  # reasoning: 블록째 생략(모델이 없다).
  # 🔴 `Reasoning` 은 optional 이라 통과한다. 그런데 `determinism.threshold_evaluation` 의
  #    `default: deterministic_rules_only` 는 **주입되지 않으므로**(U13), 이 루프의 "전부 결정론"이라는
  #    가장 중요한 사실이 산출물에 나타나지 않는다. 적으려면 `model_class: rules_only` 를 쓸 수 있으나
  #    그것은 "룰 기반 모델"이라는 뜻이고 여기엔 추론 자체가 없다.

  tools:
    allow: []
    # 근거: 툴 호출 없음. (모델이 없으므로 자명하다)

  output:
    kind: none
    # 🔴 **표현 불가 — 이 루프의 출력을 담을 enum 값이 없다.**
    #    enum 8종(draft_note/alert/card/answer/task/message/worklist_ranking/none) 중
    #    "임상 기록을 실제로 만들었고, 그 결과 판정을 호출자에게 돌려준다"에 해당하는 값이 없다.
    #    `none` 은 사실과 다르다 — 이 루프는 **행을 만든다**.
    # 🔴 표현 손실(U4 **재확인 = 구조적 · 세 축 전부**) — 반환 봉투에 슬롯이 없다:
    #    `status`(STORED/DUPLICATE/PENDING) · `pendingReason` · `duplicateOfId` · `timeFlags[]` ·
    #    `dedupeChecked` · `measuredAt`(모르면 null) · `unstored`
    #    (vitals-ingest.service.ts:174-191 → vitals.service.ts:22-32 → `meta.ingest` · vitals.controller.ts:25).
    #    🔴 특히 `dedupeChecked: false` 는 **"중복 없음"이 아니라 "판정 불가"** 다(:184-187) —
    #       세 루프에서 반복된 "모르는 것을 값으로 채우지 않는다"의 같은 형태다.
    write_back:
      target: none
      # 🔴 **거짓이지만 다른 값이 없다.** 실물은 `preVisitVitals.create`/`flowSheetEntry.create`/
      #    `icuRecord.create` 로 **법정 임상기록을 만든다**(:464-548).
      #    `target` enum = none|staging_draft|task_queue|worklist — **`clinical_record` 가 없다.**
      #    그리고 `status` 는 `const: "unsigned"` 다 — 이 기록은 초안이 아니다.
      #    → 🔴 이것이 §4-L1 의 판정 근거다: LoopSpec 의 `write_back` 은 **"AI 는 서명하지 않는다"를
      #       스키마로 못박은 구조**이고, 그래서 **사람이 확정 기록을 만드는 루프는 애초에 대상이 아니다.**
      #       억지로 담으면 스키마가 지키려던 불변식을 우리가 깨는 셈이 된다.
      # 🔴 표현 불가(**신규 N9**) — `unstored`: 받았지만 **저장할 컬럼이 없는** 6필드
      #    (`source`·`deviceId`·`deviceSerial`·`reliability`·`rawRef`·`receivedAt` · :222-223)를
      #    반환값이 그대로 실어 보낸다("저장한 척하지 않는다").
      #    `write_back.excluded_fields` 는 **자동 생성 금지 필드**라 정반대 뜻이다(모델이 만들어도 드롭).
      #    "받았고, 버리지 않았고, 담을 곳이 없어 호출자에게 되돌려준다"를 적을 자리가 없다.

  # verification: 블록째 생략.
  # 🔴 표현 불가 — 실물의 검사는 **출력 검증이 아니라 입력·시각·중복 검사**다:
  #    · 시각(`checkTime` :307-320) — 미래 허용오차 2분(**부호가 아니라 격차**를 잰다 · :195-200) ·
  #      과도 소급 24시간(:202-209).
  #    · 멱등(`findDuplicate` :410-439) — (환자/재원, 측정시각 정확일치, 활력 6값 정확일치).
  #    `Verification` 은 "출력 검증 레이어"(스키마 description)이고 입력 대조 슬롯은
  #    `numeric_crosscheck`(boolean) 하나다 → 담기지 않는다.
  # 🔴 표현 불가(**신규 N10**) — 두 임계값의 **근거(provenance)** 를 적을 자리가 없다:
  #    · 2분 = "이 저장소가 이미 겪은 오탐(1ms 역전 32건)을 흡수하면서 사람의 오타는 걸러지는 폭"
  #    · 24시간 = "🔴 이 값은 통계가 아니다 — 기기 축이 없어 p95×2 를 뽑을 분포가 없다. 임상 운영 규칙
  #      (간호 3교대 1주기)에서 왔고, 기기 축이 생기면 그 축 실측으로 **대체한다**"(:202-207).
  #    `Rule Catalog` 는 룰을 담지만 **상수의 출처와 교체 조건**을 담는 필드가 없다.
  #    이 저장소의 교훈("임계값은 감이 아니라 그 축의 과거 실측에서")이 카탈로그에 남지 않는다.

  # escalation: 생략 — 상향 사다리가 없다.
  # 🔴 그런데 이 루프는 **경보를 낳는다**: `isAbnormal` 이면 담당간호사 ∪ 주치의 ∪ 기록자에게
  #    `VITAL_ALERT`(severity CRITICAL) 를 보낸다(vitals.service.ts:156 → :163-201).
  #    경보 등록부는 그것을 `tier 1 · targetKind ATTENDING · 억제 없음 · 🔴 RRT 라우팅 없음` 으로 등재한다
  #    (notification/alert-registry.ts `VITAL_ALERT`).
  #    🔴 즉 **경보 발행은 이 루프의 호출자(VitalsService)에 있고 포트에는 없다** — 루프 경계를 어디에
  #    긋느냐에 따라 `output.kind` 가 `none` 도 되고 `alert` 도 된다. LoopSpec 에는 루프 경계를 정하는
  #    규칙이 없고, `alert` 를 고르면 L06(임계 판정 결정론 강제)·L07(offsets)·L09(ladder)가 전부 문다.

  budgets: {}
  # 🔴 `lane: sync` 인데 `budgets.latency` 가 없으면 스키마 `allOf[0]` 가 문다(L02).
  #    실물에는 지연 예산이 **없다**(측정도 없다 — 이 포트에는 `latencyMs` 개념 자체가 없다).
  #    어떤 숫자를 적어도 실물에 없는 약속이 된다 → 빈 객체로 두고 실패로 드러낸다.

  audit:
    record: []
    # 🔴 **표현 불가 — 이 루프에는 루프 감사가 없다.**
    #    변이라서 `AuditInterceptor` 가 기본 감사 ON 으로 1행을 남기지만(audit.interceptor.ts:97-145),
    #    그 행에 남는 것은 `changes.fields` = **요청 body 의 키 이름 목록**뿐이다(:150-156 — 값은 PHI 라 담지 않는다).
    #    즉 `status`·`pendingReason`·`timeFlags`·`dedupeChecked` 는 **원장에 남지 않는다.**
    #    보류함 테이블(`UnboundMeasurement`)이 없어 `PENDING` 은 **로그로만** 센다(:258-262).
    #    `audit.record[]` enum 15종 중 어느 것도 이 판정들에 대응하지 않는다.
    retention:
      audit_log: P365D
      # 근거: config `security.audit.retentionDays = 365`. 🔴 L0·A 와 같은 실측 — **읽는 코드가 없다.**
    access_log_identity: clinician_of_record
    # 근거: `AuditLog.userId` = 기록한 간호사.

  # evaluation: 생략 — 골든셋·CI 게이트 없음.
  # 🔴 다만 이 축에는 **구조 가드**가 있다(test/architecture/vitals-ingest-port-guard.spec.ts) —
  #    "포트 밖에서 활력 저장소 3종을 create 하면 실패"를 여유 0으로 동결한다.
  #    `evaluation.gates[]` 는 `{metric, operator, threshold}`(수치)라 **구조 불변식**을 담지 못한다.
  #    이 저장소에서 가장 잘 작동해 온 방어가 스키마에 자리가 없다.

  rollout:
    kill_switch:
      granularity: []
      # 🔴 **킬스위치가 없다 — 그리고 없는 것이 맞다.** 활력 기록을 끄면 임상이 멈춘다.
      #    빈 배열이 "끌 수 없음(끄면 안 됨)"이라는 **주장**으로 읽히는지 스키마 문언상 불명확하다(A4 축).
      fallback: emr_native_behavior
      # ⚠️ 의미 없음(대체할 native 동작이 없다 — 이것이 native 다).

  kpis:
    - id: vitals_pending_ratio
      direction: decrease
      # 근거: `PENDING` 건수 / 전체 수집 시도. 🔴 U9 **재확인** — 분모 슬롯이 없다.
      #    그리고 실물에는 이 지표가 **아예 없다**(로그 경고만 · :258-262). 적으면 없는 계측을 선언한다.
    - id: vitals_dedupe_unchecked_ratio
      direction: decrease
      # 근거: `dedupeChecked === false` 비율 = 측정 시각을 모른 채 들어온 비율.
      # 🔴 실물 실측: 수기 입력은 **화면에 측정 시각 칸 자체가 없어 전건이 미상**이다(:453-455).
      #    그래서 이 지표는 지금 100% 이고, 그 사실을 WARN 으로 올리면 진짜 경고가 묻힌다는 판단이
      #    코드에 있다(수기·환자보고는 debug, 어댑터만 warn · :456-461).
      #    🔴 `Kpi` 에는 "이 지표는 현재 구조적으로 100%이며 그 자체가 결함이 아니다"라는
      #       **해석 규약**을 적을 자리가 없다 → 자동 생성 대시보드는 빨간 지표를 하나 만든다.
