name: CI

# 🔴 배포 단계는 넣지 않는다 — 배포는 로컬 → rsync → 서버 빌드 하나뿐이다(CLAUDE.md §Deployment Rules · GitHub 기능으로 배포하지 않는다).
#
# 🔴 2026-09-13 상용 릴리즈 T2-7: self-hosted `werub-prod` 러너 → **GitHub hosted `ubuntu-latest`**.
#    서버 이전(2026-09-09)으로 self-hosted 러너 2대가 `offline` — 러너가 사라지면 조용히 멈추는 구조를 버린다.
# 🔴 2026-09-13 재실측(원인 정정 — 앞선 설명 "러너가 붙지 않아 실패"는 틀렸다):
#    · 09-06~09-08 실패 20회는 **러너 할당 실패가 아니었다** — 잡이 `werub-prod-runner(-2)` 에 3초 안에 붙었고,
#      `Unit tests (web)` 가 `TypeError: globSync is not a function`(Node 20 에 없는 API)로 **실제 실패**했다(가드 2파일 · 이후 readdirSync 로 교정됨).
#    · 09-08 이후 실행 0 은 **워크플로가 `disabled_manually`** 이기 때문이다(워크플로 updated_at 2026-09-08T01:47Z = 마지막 실행 57분 뒤).
#      이 파일을 아무리 고쳐도 **재활성화 전에는 한 번도 돌지 않는다** — `gh workflow enable CI -R seanshin/werubyHIS`(사람 몫).
#    · 이 워크플로의 세 잡은 2026-09-13 로컬에서 CI 와 같은 조건(.env·HIS_MODE·DATABASE_URL 없음·빈 PG16)으로 재현해 통과를 확인했다
#      (근거 `docs/05-reference/ci-runners.md` §재실측) — 원격 초록의 증거는 아니다.
# 🔴 Node 는 `.nvmrc`(22 — 서버 빌드 v22.22.1 과 일치) 하나에서 읽는다. 종전 "20" 은 로컬 25·서버 22 와 갈라져 있었다.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 🔴 운영 런타임과 같은 시간대 — pm2·빌드가 `TZ=Asia/Seoul` 로 돈다(deploy.sh PM2_ENV/REMOTE_ENV). hosted 러너 기본은 UTC 라
  #    date-only·KST 자정 오라클 스펙이 실패한다(2026-09-13 node:22 컨테이너 재현: api 5파일·web 3파일 실패 → TZ 지정 시 api 0·web 3→아래 ICU 건만 남음).
  #    가드를 완화하는 것이 아니라 운영과 같은 전제를 명시하는 것이다.
  TZ: Asia/Seoul
  # nest build/Next build 의 Node heap 상향 — 기본(~2GB)에서 nest build heap OOM(exit 134) 방지(ubuntu-latest 16GB).
  NODE_OPTIONS: "--max-old-space-size=4096"
  DUMMY_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

jobs:
  typecheck-and-test:
    name: Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 🔴 lockfile 강제(`npm ci`) — 서버 배포가 의존성을 설치하지 않던 문제(T2-6)와 같은 뿌리를 CI 에서는 막는다.
      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@hospital-run/shared

      - name: Prisma Generate
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}

      - name: Prisma Validate
        run: cd apps/api && npx prisma validate
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}

      # tsc 3층 — 릴리즈 게이트 G3 와 같은 판정
      - name: TypeScript Check (API)
        run: cd apps/api && npx tsc --noEmit
      - name: TypeScript Check (Web)
        run: cd apps/web && npx tsc --noEmit
      - name: TypeScript Check (Shared)
        run: cd packages/shared && npx tsc --noEmit

      # React Hooks 규칙 가드 — early-return 뒤 hook(#300) 차단
      - name: React hooks rules (web)
        run: cd apps/web && npm run lint:hooks

      # 배치중립 N2 tier 게이트 — location-free 모듈의 PHI 참조 차단(module-tier-manifest 동결)
      - name: Batch-neutral tier gate (N2)
        run: bash scripts/check-tier.sh

      # 화면번호 무결성 — `/admin/screen-codes` 가 "CI 로 보장"이라 말하면 실제로 붙어 있어야 한다(W8 2026-08-14)
      - name: Screen code integrity (web)
        run: cd apps/web && npm run check:screen-codes

      # 🔴 전체 수로 돈다 — `vitest run test` 는 src 스펙을 빼므로 전체가 아니다(CLAUDE.md 에서 한 번 틀렸다).
      - name: Unit tests (shared)
        run: cd packages/shared && npx vitest run
      - name: Unit tests (web)
        run: cd apps/web && npx vitest run
      - name: Unit tests (api — include 전체)
        run: cd apps/api && npx vitest run

  # 🔴 빈 PostgreSQL 16 에 마이그레이션이 **실제로 끝까지 적용되는가** — 릴리즈 게이트 G9 의 기계 부분(상용 릴리즈 T2-1).
  #    기준선 도입 전에는 `_prisma_migrations` 이력이 없어 이 검사가 불가능했다. 부속 객체(부분 유니크·트리거)까지 확인한다.
  empty-db-migrate:
    name: Empty DB migrate deploy (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: his
          POSTGRES_PASSWORD: his
          POSTGRES_DB: his_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U his -d his_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://his:CHANGE_ME@localhost:5432/his_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: prisma migrate deploy
        run: cd apps/api && npx prisma generate && npx prisma migrate deploy
      - name: Ancillary objects present (install.sh 3단계와 같은 기대값)
        run: |
          R=$(psql "$DATABASE_URL" -Atc "select
            (select count(*) from pg_extension where extname='pg_trgm'),
            (select count(*) from pg_class where relkind='S' and relname='mrn_daily_seq'),
            (select count(*) from pg_indexes where indexname in ('uq_er_bed_active','uq_er_visit_active','consent_templates_name_lang_latest_key','formulary_items_uniq_nn')),
            (select count(*) from pg_trigger where tgname='trg_voucher_events_append_only')")
          echo "trgm|seq|uniq4|trigger = $R"
          test "$R" = "1|1|4|1"
      - name: Table count equals Prisma models
        run: |
          T=$(psql "$DATABASE_URL" -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name <> '_prisma_migrations'")
          M=$(grep -c '^model ' apps/api/prisma/schema.prisma)
          echo "tables=$T models=$M"
          test "$T" = "$M"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prisma Generate
        run: cd apps/api && npx prisma generate
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}

      # 루트 `turbo.json` 을 쓴다 — `^build` 로 shared 까지 함께 빌드
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Build API (turbo)
        run: npx turbo run build --filter=@hospital-run/api

      # 🔴 `next build` 만 잡는 층이 있다(page.tsx 불허 export 로 배포 실패 — CLAUDE.md §8). 테스트 초록이 이것을 대신하지 못한다.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build Web
        # exit 137 이 간헐적이었다(과거 self-hosted 실측) — 1회 재시도
        run: |
          cd apps/web
          npm run build || { code=$?; echo "1차 실패(exit ${code}) — 90s 대기 후 재시도"; sleep 90; npm run build; }
        env:
          NEXT_PUBLIC_API_URL: ''
          NODE_OPTIONS: "--max-old-space-size=6144"
